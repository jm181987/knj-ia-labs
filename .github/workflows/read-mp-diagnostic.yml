name: Read Mercado Pago diagnostic
on:
  push:
    branches: [verify/vercel-health]
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Verify minimal checkout payload
        run: |
          set -euo pipefail
          body=$(curl -sS -L --max-time 30 https://knjpro.site/api/mp-diagnostic)
          echo "$body"
          echo "$body" | grep -q '"checkout_created":true'
