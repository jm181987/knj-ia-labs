name: Payment hardening check
on:
  push:
    branches: [fix/payment-provider-hardening]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Syntax check payment backend
        run: |
          node --check backend/src/functions/paypal.mjs
          node --check backend/src/functions/mercadopago.mjs
          node --check backend/src/server.mjs
