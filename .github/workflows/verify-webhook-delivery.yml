name: Verify webhook delivery
on:
  push:
    branches: [verify/vercel-health]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production payment endpoints
        run: |
          set -euo pipefail

          check() {
            name="$1"; expected="$2"; shift 2
            code=$(curl -sS -o /tmp/body -w '%{http_code}' "$@")
            echo "$name=$code"
            test "$code" = "$expected"
          }

          check mp_webhook_direct 200 -X POST https://www.knjpro.site/api/functions/mp-webhook -H 'content-type: application/json' -d '{}'
          check mp_sync_requires_auth 401 -X POST https://www.knjpro.site/api/functions/mp-sync-payment -H 'content-type: application/json' -d '{"payment_id":"00000000-0000-0000-0000-000000000000"}'
          check paypal_webhook_signature_required 401 -X POST https://www.knjpro.site/api/functions/paypal-webhook -H 'content-type: application/json' -d '{}'
          check api_health 200 https://www.knjpro.site/api/health

          code=$(curl -sS -o /tmp/apex -D /tmp/apex_headers -w '%{http_code}' -X POST https://knjpro.site/api/functions/mp-webhook -H 'content-type: application/json' -d '{}')
          location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {print $2}' /tmp/apex_headers | tr -d '\r' | tail -1)
          echo "apex_mp_webhook=$code location=$location"
          test "$code" = "307"
          test "$location" = "https://www.knjpro.site/api/functions/mp-webhook"
