name: Verify client pricing descriptions hide USD
on:
  push:
    branches: [verify/vercel-health]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Assert pricing API hides USD for non-admin clients
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H 'content-type: application/json' \
            -d '{"table":"pricing","action":"select","select":"key,credits,description"}' \
            https://knj-ia-labs.vercel.app/api/data -o /tmp/pricing.json
          python - <<'PY'
          import json,re
          d=json.load(open('/tmp/pricing.json'))
          rows=d.get('data') or []
          assert rows, d
          leaks=[r for r in rows if re.search(r'\bUSD\b|US\$', str(r.get('description') or ''), re.I)]
          print('rows=', len(rows))
          print('usd_leaks=', len(leaks))
          assert not leaks, leaks[:5]
          print('ok=true')
          PY
