name: Verify payment provider env
on:
  push:
    branches: [verify/vercel-health]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check production provider configuration
        run: |
          set -euo pipefail
          echo '--- paypal ---'
          curl -sS -L -X POST https://knjpro.site/api/functions/paypal-config -H 'content-type: application/json' -d '{}' -D /tmp/paypal.headers -o /tmp/paypal.body
          tail -n 20 /tmp/paypal.headers
          echo 'paypal_body_prefix='$(head -c 120 /tmp/paypal.body | tr '\n' ' ')
          echo '--- mp ---'
          curl -sS -L -X POST https://knjpro.site/api/functions/mp-health -H 'content-type: application/json' -d '{}' -D /tmp/mp.headers -o /tmp/mp.body
          tail -n 20 /tmp/mp.headers
          echo 'mp_body_prefix='$(head -c 120 /tmp/mp.body | tr '\n' ' ')
          python - <<'PY'
          import json
          p=json.load(open('/tmp/paypal.body'))
          m=json.load(open('/tmp/mp.body'))
          print('paypal_mode=', p.get('mode'))
          print('paypal_oauth_ok=', p.get('oauth_ok'))
          print('paypal_oauth_code=', p.get('oauth_code'))
          print('paypal_alternate_mode_match=', p.get('alternate_mode_match'))
          print('paypal_webhook_configured=', p.get('webhook_configured'))
          print('mp_configured=', m.get('configured'))
          print('mp_token_ok=', m.get('token_ok'))
          print('mp_webhook_secret_configured=', m.get('webhook_secret_configured'))
          print('mp_checkout_api=', m.get('checkout_api'))
          print('mp_code=', m.get('code'))
          PY
