name: Read production self-test

on:
  push:
    branches:
      - verify/vercel-health

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read production self-test
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/selftest.json -w '%{http_code}' https://knj-ia-labs.vercel.app/api/internal-selftest)
          echo "HTTP_STATUS=$status"
          cat /tmp/selftest.json
          echo
          python - <<'PY'
          import json
          d=json.load(open('/tmp/selftest.json'))
          print('SELFTEST_OK=', d.get('ok'))
          for k in [
            'database','admin_password_configured','admin_login','admin_role',
            'credits_read','credits_transaction_rollback','wavespeed_models',
            'wavespeed_image_models','wavespeed_video_models','generation_pipeline_health',
            'paypal_auth','mercadopago_auth','credit_packages_available'
          ]:
              print(f'{k}={d.get(k)}')
          print('paypal_mode=', d.get('paypal_mode'))
          print('ERROR=', d.get('error'))
          print('WAVESPEED_ERROR=', d.get('wavespeed_error'))
          print('PAYPAL_ERROR=', d.get('paypal_error'))
          print('MP_ERROR=', d.get('mercadopago_error'))
          PY
