name: Verify PayPal production config
on:
  push:
    branches: [verify/vercel-health]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check PayPal public config and JS SDK
        run: |
          set -euo pipefail
          curl -sS -X POST -H 'content-type: application/json' -d '{}' https://knj-ia-labs.vercel.app/api/functions/paypal-config -o /tmp/paypal.json
          python - <<'PY'
          import json,re
          d=json.load(open('/tmp/paypal.json'))
          cid=str(d.get('client_id') or '')
          mode=str(d.get('mode') or '')
          print('client_id_present=', bool(cid))
          print('client_id_length=', len(cid))
          print('mode=', mode)
          print('leading_or_trailing_space=', cid != cid.strip())
          print('wrapped_in_quotes=', len(cid)>=2 and cid[0] in "\"'" and cid[-1]==cid[0])
          print('safe_charset=', bool(re.fullmatch(r'[A-Za-z0-9._~-]+', cid)))
          assert cid, d
          assert mode in ('sandbox','production'), d
          open('/tmp/client_id','w').write(cid)
          PY
          CID=$(cat /tmp/client_id)
          CODE=$(curl -sS -o /tmp/sdk.js -w '%{http_code}' "https://www.paypal.com/sdk/js?client-id=${CID}&currency=USD&intent=capture")
          echo "sdk_http=$CODE"
          test "$CODE" = "200"
          python - <<'PY'
          import re
          cid=open('/tmp/client_id').read()
          text=open('/tmp/sdk.js',errors='replace').read().replace(cid,'[REDACTED_CLIENT_ID]')
          print('sdk_validation_error=', bool(re.search(r'SDK Validation error',text,re.I)))
          assert not re.search(r'SDK Validation error',text,re.I)
          PY
